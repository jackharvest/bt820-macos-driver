# IPP attributes advertised by the BT820 queue.
#
# NOTE 1: ippeveprinter rejects -f/-M/-m when -a is given, so make/model is
#         declared here. Do NOT add document-format-* here -- ippeveprinter
#         emits those itself and duplicates make the printer fail validation.
# NOTE 2: using -a replaces ippeveprinter's built-in attribute set (which
#         hardcodes US Letter), so the media collections below must be spelled
#         out in full or macOS lays jobs out at Letter size.
# Dimensions are hundredths of a millimetre: 4x6in = 10160 x 15240.

ATTR mimeMediaType document-format-supported application/octet-stream,application/pdf,image/jpeg,image/png,image/gif,image/urf,image/pwg-raster
ATTR mimeMediaType document-format-default application/octet-stream
ATTR text printer-make-and-model "REKDOM BT820"
ATTR text printer-info "BT820 4x6 thermal label printer"

ATTR keyword media-default na_index-4x6_4x6in
ATTR keyword media-supported na_index-4x6_4x6in
ATTR keyword media-ready na_index-4x6_4x6in
ATTR keyword media-source-supported main-roll
ATTR keyword media-type-supported labels
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0
ATTR integer media-bottom-margin-supported 0

ATTR collection media-size-supported {
    MEMBER integer x-dimension 10160
    MEMBER integer y-dimension 15240
}

ATTR collection media-col-default {
    MEMBER keyword media-size-name na_index-4x6_4x6in
    MEMBER collection media-size {
        MEMBER integer x-dimension 10160
        MEMBER integer y-dimension 15240
    }
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER integer media-top-margin 0
    MEMBER integer media-bottom-margin 0
    MEMBER keyword media-source main-roll
    MEMBER keyword media-type labels
}

ATTR collection media-col-database {
    MEMBER collection media-size {
        MEMBER integer x-dimension 10160
        MEMBER integer y-dimension 15240
    }
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER integer media-top-margin 0
    MEMBER integer media-bottom-margin 0
    MEMBER keyword media-source main-roll
    MEMBER keyword media-type labels
}

ATTR keyword print-color-mode-default monochrome
ATTR keyword print-color-mode-supported monochrome
ATTR resolution printer-resolution-default 203x203dpi
ATTR resolution printer-resolution-supported 203x203dpi
ATTR keyword sides-default one-sided
ATTR keyword sides-supported one-sided
